<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Abdullah</title>
<meta name="description" content="A special birthday surprise for Abdullah.">
<meta name="theme-color" content="#07070c">

<meta property="og:type" content="website">
<meta property="og:title" content="For Abdullah">
<meta property="og:description" content="Something magical is waiting to be opened.">

<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>%E2%9C%A6</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Outfit:wght@200;300;400;500;600&family=Great+Vibes&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body class="page-gate">

  <!-- Premium Background Effects -->
  <div class="aurora" aria-hidden="true">
    <span class="aurora__blob aurora__blob--1"></span>
    <span class="aurora__blob aurora__blob--2"></span>
    <span class="aurora__blob aurora__blob--3"></span>
  </div>
  <canvas id="starfield" class="starfield" aria-hidden="true"></canvas>
  <div class="grain" aria-hidden="true"></div>
  <div class="floating-particles" id="floatingParticles"></div>

  <main class="gate">

    <!-- Elegant Header -->
    <div class="gate-header">
      <div class="gate-eyebrow">
        <span class="gate-line"></span>
        <span class="gate-date">✨ A Special Day ✨</span>
        <span class="gate-line"></span>
      </div>
    </div>

    <!-- Premium Monogram -->
    <div class="monogram-premium" aria-hidden="true">
      <div class="monogram-ring">
        <svg viewBox="0 0 120 120" class="monogram-ring-svg">
          <circle cx="60" cy="60" r="56" fill="none" stroke="url(#gradientRing)" stroke-width="2"/>
          <defs>
            <linearGradient id="gradientRing" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" style="stop-color:#667eea" />
              <stop offset="100%" style="stop-color:#764ba2" />
            </linearGradient>
          </defs>
        </svg>
        <div class="monogram-inner">
          <span class="monogram-letter">A</span>
          <div class="monogram-sparkles" id="monogramSparkles"></div>
        </div>
      </div>
    </div>

    <!-- Beautiful Title -->
    <h1 class="gate-title">
      <span class="gate-line-text">For</span>
      <span class="gate-name-premium shimmer">Abdullah</span>
      <div class="title-underline"></div>
    </h1>

    <!-- Elegant Subtitle -->
    <p class="gate-subtitle">
      <i class="fa-solid fa-sparkles"></i>
      A magical surprise awaits behind the seal
      <i class="fa-solid fa-sparkles"></i>
    </p>

    <!-- Premium Seal Button -->
    <div class="seal-container">
      <button class="seal-premium" id="seal" type="button" aria-label="Open the surprise for Abdullah">
        <div class="seal-outer-ring"></div>
        <div class="seal-inner-ring"></div>
        <div class="seal-center">
          <span class="seal-icon">✦</span>
          <span class="seal-text">Open Your Surprise</span>
          <span class="seal-hint">Tap to reveal</span>
        </div>
        <div class="seal-particles" id="sealParticles"></div>
      </button>
    </div>

    <!-- Floating Elements -->
    <div class="floating-hearts" id="floatingHearts"></div>

  </main>

  <div class="bloom" id="bloom" aria-hidden="true"></div>

  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <script src="js/java.js"></script>
  <script>
    // Premium Gate Page Functionality
    document.getElementById('seal').addEventListener('click', function() {
      const bloom = document.getElementById('bloom');
      bloom.classList.add('active');
      
      // Launch confetti burst
      confetti({
        particleCount: 200,
        spread: 100,
        origin: { y: 0.6 },
        colors: ['#667eea', '#764ba2', '#f5af19', '#ffd6d6', '#e6e6fa']
      });
      
      setTimeout(() => {
        window.location.href = 'celebrate.html';
      }, 1800);
    });
    
    // Create premium sparkles for monogram
    function createMonogramSparkles() {
      const container = document.getElementById('monogramSparkles');
      if (!container) return;

      for (let i = 0; i < 12; i++) {
        const sparkle = document.createElement('div');
        sparkle.className = 'monogram-sparkle';
        sparkle.style.left = Math.random() * 100 + '%';
        sparkle.style.top = Math.random() * 100 + '%';
        sparkle.style.animationDelay = Math.random() * 2 + 's';
        container.appendChild(sparkle);
      }
    }
    
    // Create floating particles
    function createFloatingParticles() {
      const container = document.getElementById('floatingParticles');
      if (!container) return;

      for (let i = 0; i < 30; i++) {
        const particle = document.createElement('div');
        particle.className = 'floating-particle';
        particle.style.left = Math.random() * 100 + '%';
        particle.style.animationDelay = Math.random() * 5 + 's';
        particle.style.animationDuration = (8 + Math.random() * 4) + 's';
        container.appendChild(particle);
      }
    }
    
    // Create floating hearts
    function createFloatingHearts() {
      const container = document.getElementById('floatingHearts');
      if (!container) return;

      setInterval(() => {
        const heart = document.createElement('div');
        heart.className = 'floating-heart';
        heart.style.left = Math.random() * 100 + '%';
        heart.style.animationDuration = (4 + Math.random() * 3) + 's';
        container.appendChild(heart);
        
        setTimeout(() => heart.remove(), 7000);
      }, 2000);
    }
    
    // Initialize all effects
    document.addEventListener('DOMContentLoaded', () => {
      createMonogramSparkles();
      createFloatingParticles();
      createFloatingHearts();
    });
  </script>
</body>
</html>
